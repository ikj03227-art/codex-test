<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef4ff">
    <title>Codex Cloud 動作確認</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card" aria-labelledby="success-message">
      <p class="eyebrow">CODEX CLOUD CHECK</p>
      <h1 id="success-message">スマホだけで<br>Codex Cloud成功！</h1>
      <p class="counter" aria-live="polite">
        ボタンを押した回数
        <strong><span id="count">0</span>回</strong>
      </p>
      <button id="count-button" type="button">カウントする</button>
      <p class="note">回数はこの端末に保存されます</p>
    </main>
  </body>
</html>
